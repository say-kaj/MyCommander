[package]
name = "mycommander"
version = "1.4.0"
edition = "2021"
description = "myCommander - a native two-panel file manager for macOS"

[[bin]]
name = "myCommander"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_commonmark = "0.20"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
resvg = "0.50.0"
encoding_rs = "0.8.44"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
